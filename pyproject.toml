[project]
name = "verticliv"
version = "0.19.0"
description = "Verticliv: captions, gaming layouts and reliable resumable YouTube publishing"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "faster-whisper>=1.1.1,<2",
  "Pillow>=10.4",
  "pydantic>=2.7",
  "PySide6>=6.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "requests>=2.32",
  "google-api-python-client>=2.170",
  "google-auth>=2.40",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
verticliv = "arara_factory.entry:main"
verticliv-gui = "arara_factory.entry:main"
verticliv-batch = "arara_factory.entry:main"
# Retain existing commands for shortcuts and personal automation.
arara-factory = "arara_factory.entry:main"
arara-factory-gui = "arara_factory.entry:main"
arara-factory-batch = "arara_factory.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arara_factory"]
