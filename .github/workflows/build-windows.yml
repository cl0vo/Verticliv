name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'installer/**'
      - 'launcher.py'
      - 'pyproject.toml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: arara-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Validate source versions and publishing modules
        shell: pwsh
        run: |
          python -m compileall -q src launcher.py
          @'
          import re
          import tomllib
          from pathlib import Path

          import PySide6.QtMultimedia
          import PySide6.QtMultimediaWidgets
          import google.oauth2.credentials
          import google.auth.exceptions
          import google_auth_oauthlib.flow
          import googleapiclient.discovery
          import googleapiclient.http
          import httplib2
          import requests
          from google.auth.transport.requests import AuthorizedSession

          import arara_factory.entry
          import arara_factory.publishing
          import arara_factory.publishing_journal
          import arara_factory.publishing_library_ui
          import arara_factory.publishing_oauth_ui
          import arara_factory.publishing_reliable
          import arara_factory.publishing_reliable_ui
          import arara_factory.publishing_targets
          import arara_factory.publishing_targets_ui
          import arara_factory.smart_ui

          from arara_factory.process_utils import hidden_process_kwargs
          from arara_factory.secure_store import credentials_path, load_credentials, save_credentials
          from arara_factory.version import __version__

          package = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          installer_text = Path('installer/arara_factory.iss').read_text(encoding='utf-8')
          match = re.search(r'#define MyAppVersion "([^"]+)"', installer_text)
          assert match, 'Installer version missing'
          installer = match.group(1)
          assert package == __version__ == installer, (package, __version__, installer)

          scripts = tomllib.load(open('pyproject.toml', 'rb'))['project']['scripts']
          assert set(scripts.values()) == {'arara_factory.entry:main'}, scripts

          hidden = hidden_process_kwargs()
          assert hidden.get('creationflags', 0), hidden
          assert hidden.get('startupinfo') is not None, hidden

          secret_file = credentials_path()
          previous = secret_file.read_bytes() if secret_file.exists() else None
          try:
              save_credentials({'youtube': {'token': {'refresh_token': 'ci-secret'}}})
              assert secret_file.read_bytes().startswith(b'DPAPI\0')
              assert load_credentials()['youtube']['token']['refresh_token'] == 'ci-secret'
          finally:
              if previous is None:
                  secret_file.unlink(missing_ok=True)
              else:
                  secret_file.write_bytes(previous)

          print(f'ARARA source validation OK: {package}')
          '@ | python -
          pytest -q

      - name: Smoke-test final reliable UI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          @'
          from PySide6.QtGui import QCloseEvent
          from PySide6.QtWidgets import QApplication, QMessageBox
          from arara_factory.publishing import Platform
          from arara_factory.publishing_reliable_ui import ReliablePublishingWindow

          app = QApplication([])
          window = ReliablePublishingWindow()

          assert window.mode_tabs.count() == 2
          assert window.mode_tabs.tabText(0) == 'Создать Reels'
          assert window.mode_tabs.tabText(1).startswith('Опубликовать')
          assert window.create_stack.count() == 4
          assert window.publish_stack.count() == 4
          assert set(window.schedule_platform_boxes) == set(Platform)
          assert window.choose_reels_button.text() == 'Выбрать файлы'
          assert window.choose_folder_button.text() == 'Выбрать папку'
          assert window.schedule_selected_button.text() == 'Добавить в очередь'
          assert window.publish_summary.wordWrap() is True
          assert hasattr(window, '_recover_interrupted_uploads')
          assert hasattr(window, '_next_runnable_job')

          original_question = QMessageBox.question
          QMessageBox.question = lambda *args, **kwargs: QMessageBox.StandardButton.Yes
          try:
              event = QCloseEvent()
              window.closeEvent(event)
              assert event.isAccepted()
          finally:
              QMessageBox.question = original_question

          app.processEvents()
          print('ARARA reliable UI smoke test OK')
          '@ | python -

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $bin -or -not $probe) { throw 'FFmpeg download incomplete' }
          Copy-Item $bin.FullName ffmpeg.exe
          Copy-Item $probe.FullName ffprobe.exe

      - name: Smoke-test real render and queue migration
        shell: pwsh
        run: |
          .\ffmpeg.exe -y -hide_banner -loglevel error -f lavfi -i "color=c=blue:s=270x480:r=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 9 -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac smoke-reel.mp4
          .\ffmpeg.exe -y -hide_banner -loglevel error -f lavfi -i "color=c=red:s=320x180:r=30" -t 20 -c:v libx264 -preset ultrafast -pix_fmt yuv420p smoke-brainrot.mp4
          @'
          import subprocess
          from pathlib import Path
          from PIL import Image

          from arara_factory.geometry import canonical_layout
          from arara_factory.publishing import Platform, PublishQueue
          from arara_factory.publishing_targets import prune_unselected_targets
          from arara_factory.render import RenderOptions, _binary, probe_media, render_reels

          values = []
          output = Path('smoke-output')
          made = render_reels(
              Path('smoke-reel.mp4'),
              Path('smoke-brainrot.mp4'),
              output,
              RenderOptions(
                  subtitles_enabled=True,
                  subtitle_mode='arara',
                  encoder_mode='cpu',
                  encoder_preset='ultrafast',
                  crf=28,
              ),
              progress=lambda value, text: values.append((value, text)),
              log=print,
          )
          assert len(made) == 1 and made[0].is_file(), made
          assert values[-1][0] == 100
          assert any(20 <= value <= 95 for value, _ in values)
          assert not list(output.glob('*.part.mp4'))

          queue = PublishQueue(Path('smoke-queue.json'))
          job = queue.enqueue(
              made,
              [Platform.TIKTOK, Platform.INSTAGRAM, Platform.YOUTUBE],
              'ARARA {n}',
              15,
              start_at=1,
          )[0]
          queue.update_delivery(job, Platform.TIKTOK, status='failed', error='not connected')
          queue.update_delivery(job, Platform.INSTAGRAM, status='failed', error='not connected')
          result = prune_unselected_targets(queue, [Platform.YOUTUBE])
          assert result.removed_deliveries == 2
          restored = PublishQueue(Path('smoke-queue.json')).jobs[0]
          assert set(restored.deliveries) == {'youtube'}

          ffprobe = _binary('ffprobe')
          ffmpeg = _binary('ffmpeg')
          info = probe_media(ffprobe, made[0])
          assert 8.85 <= info.duration <= 9.15, info.duration

          first = Path('first-frame.png')
          subprocess.run(
              [ffmpeg, '-y', '-hide_banner', '-loglevel', 'error', '-i', str(made[0]), '-frames:v', '1', str(first)],
              check=True,
          )
          image = Image.open(first).convert('RGB')
          _, brain = canonical_layout(info.width, info.height)
          pixel = image.getpixel((brain.x + brain.width // 2, brain.y + brain.height // 2))
          assert pixel[0] > 120 and pixel[0] > pixel[2] + 60, pixel
          print('ARARA real render smoke test OK')
          '@ | python -

      - name: Build Windows application
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm',
            '--clean',
            '--windowed',
            '--onedir',
            '--name', 'ARARA-Factory',
            '--paths', 'src',
            '--hidden-import', 'arara_factory.entry',
            '--hidden-import', 'arara_factory.batch_worker',
            '--hidden-import', 'arara_factory.integrated_batch',
            '--hidden-import', 'arara_factory.process_utils',
            '--hidden-import', 'arara_factory.publishing',
            '--hidden-import', 'arara_factory.publishing_journal',
            '--hidden-import', 'arara_factory.publishing_library',
            '--hidden-import', 'arara_factory.publishing_library_ui',
            '--hidden-import', 'arara_factory.publishing_oauth_ui',
            '--hidden-import', 'arara_factory.publishing_reliable',
            '--hidden-import', 'arara_factory.publishing_reliable_ui',
            '--hidden-import', 'arara_factory.publishing_targets',
            '--hidden-import', 'arara_factory.publishing_targets_ui',
            '--hidden-import', 'arara_factory.secure_store',
            '--hidden-import', 'arara_factory.smart_ui',
            '--hidden-import', 'arara_factory.social_oauth',
            '--hidden-import', 'google.auth.transport.requests',
            '--hidden-import', 'google.auth.exceptions',
            '--hidden-import', 'google.oauth2.credentials',
            '--hidden-import', 'requests',
            '--hidden-import', 'googleapiclient.discovery',
            '--hidden-import', 'googleapiclient.errors',
            '--hidden-import', 'googleapiclient.http',
            '--hidden-import', 'google_auth_oauthlib.flow',
            '--hidden-import', 'google_auth_httplib2',
            '--hidden-import', 'httplib2',
            '--collect-all', 'googleapiclient',
            '--collect-all', 'google_auth_oauthlib',
            '--hidden-import', 'PySide6.QtMultimedia',
            '--hidden-import', 'PySide6.QtMultimediaWidgets',
            '--add-binary', 'ffmpeg.exe;.',
            '--add-binary', 'ffprobe.exe;.',
            'launcher.py'
          )
          python -m PyInstaller @args
          if (-not (Test-Path 'dist\ARARA-Factory\ARARA-Factory.exe')) {
            throw 'ARARA Factory executable missing'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler not found' }

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler 'installer\arara_factory.iss'
          if (-not (Test-Path 'installer-output\ARARA-Factory-Setup.exe')) {
            throw 'Installer was not created'
          }

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: ARARA-Factory-Installer
          path: installer-output/ARARA-Factory-Setup.exe
          if-no-files-found: error

      - name: Upload portable app
        uses: actions/upload-artifact@v6
        with:
          name: ARARA-Factory-Portable
          path: dist/ARARA-Factory/**
          if-no-files-found: error

      - name: Publish update release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $tag = "v$version"
          $asset = 'installer-output/ARARA-Factory-Setup.exe'
          $repo = $env:GITHUB_REPOSITORY

          $existing = gh release list --repo $repo --limit 100 --json tagName | ConvertFrom-Json
          $exists = @($existing | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          if ($exists) {
            gh release upload $tag $asset --repo $repo --clobber
          } else {
            gh release create $tag $asset --repo $repo --target $env:GITHUB_SHA --title "ARARA Factory $version" --notes "Personal ARARA workflow update: reliable resumable YouTube uploads, safe paused/interval-spaced backlogs, single-item retry, validated vertical renders, and a configurable looping alpha banner."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }

          $release = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names -notcontains 'ARARA-Factory-Setup.exe') {
            throw 'Release installer asset missing'
          }
          Write-Host "Published $tag"
